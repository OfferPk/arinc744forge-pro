<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0a0e17"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="920" height="45" rx="6" fill="#111827" stroke="#2e3b52"/>
  <text x="35" y="48" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">ARINC744Forge Pro &mdash; Full Flight Deck Printer Engineering Studio</text>
  <rect x="750" y="30" width="170" height="25" rx="12" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
  <text x="765" y="47" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80">100% COMPLIANT</text>

  <!-- Left Printer Bezel -->
  <rect x="20" y="80" width="360" height="440" rx="10" fill="#1a2234" stroke="#334155" stroke-width="2"/>
  <text x="35" y="110" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">FLIGHT DECK PRINTER (PEDESTAL 1)</text>

  <!-- LED bar -->
  <rect x="35" y="125" width="70" height="25" rx="4" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
  <text x="50" y="142" font-family="monospace" font-size="10" font-weight="bold" fill="#4ade80">READY</text>
  <rect x="115" y="125" width="70" height="25" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="125" y="142" font-family="monospace" font-size="10" fill="#64748b">PAPER LOW</text>
  <rect x="195" y="125" width="70" height="25" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="210" y="142" font-family="monospace" font-size="10" fill="#64748b">FAULT</text>
  <rect x="275" y="125" width="70" height="25" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="285" y="142" font-family="monospace" font-size="10" fill="#64748b">PRINTING</text>

  <!-- Paper exit slot & receipt -->
  <rect x="35" y="160" width="330" height="230" rx="6" fill="#030712" stroke="#1f2937"/>
  <rect x="45" y="170" width="310" height="8" rx="4" fill="#000" stroke="#334155"/>
  <rect x="55" y="185" width="290" height="195" rx="4" fill="#f8fafc"/>
  <text x="65" y="205" font-family="Courier, monospace" font-size="10" font-weight="bold" fill="#0f172a">*** SHANWICK OCEANIC ATC ***</text>
  <text x="65" y="222" font-family="Courier, monospace" font-size="9" fill="#1e293b">TIME: 22:35 UTC   DATE: 15-OCT-2026</text>
  <text x="65" y="238" font-family="Courier, monospace" font-size="9" fill="#1e293b">ACID: BAW178      ICAO: 40058A</text>
  <text x="65" y="254" font-family="Courier, monospace" font-size="9" fill="#1e293b">ROUTE: NAT TRACK FOXTROT</text>
  <text x="65" y="270" font-family="Courier, monospace" font-size="9" fill="#1e293b">ENTRY: ELSIR AT 23:45 UTC</text>
  <text x="65" y="286" font-family="Courier, monospace" font-size="9" fill="#1e293b">MAINTAIN: FL360   MACH: M0.84</text>
  <text x="65" y="302" font-family="Courier, monospace" font-size="9" fill="#1e293b">EXIT: COLOR AT 03:15 UTC</text>
  <text x="65" y="318" font-family="Courier, monospace" font-size="9" fill="#1e293b">CLEARANCE ISSUED VIA CPDLC</text>
  <text x="65" y="334" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#0f172a">--------------------------------</text>
  <text x="65" y="350" font-family="Courier, monospace" font-size="9" fill="#0f172a">PILOT ACK REQ VIA FMS</text>

  <!-- Button controls -->
  <rect x="35" y="405" width="100" height="35" rx="4" fill="#0284c7" stroke="#38bdf8"/>
  <text x="45" y="427" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">OCEANIC ATC</text>
  <rect x="145" y="405" width="100" height="35" rx="4" fill="#0284c7" stroke="#38bdf8"/>
  <text x="155" y="427" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">METAR / WX</text>
  <rect x="255" y="405" width="110" height="35" rx="4" fill="#0284c7" stroke="#38bdf8"/>
  <text x="262" y="427" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">TAKEOFF PERF</text>

  <rect x="35" y="450" width="155" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="472" font-family="monospace" font-size="10" fill="#cbd5e1">FEED LINE (LF)</text>
  <rect x="200" y="450" width="165" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="472" font-family="monospace" font-size="10" fill="#cbd5e1">FORM FEED (FF)</text>

  <!-- Right Dashboards -->
  <rect x="400" y="80" width="540" height="210" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="415" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">THERMAL HEAD DYNAMICS &amp; HARDWARE SENSORS</text>
  
  <rect x="415" y="125" width="115" height="55" rx="4" fill="#0b111e"/>
  <text x="435" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">84.8%</text>
  <text x="425" y="170" font-family="monospace" font-size="9" fill="#64748b">PAPER ROLL LEFT</text>

  <rect x="545" y="125" width="115" height="55" rx="4" fill="#0b111e"/>
  <text x="565" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">29.1 °C</text>
  <text x="555" y="170" font-family="monospace" font-size="9" fill="#64748b">HEAD TEMPERATURE</text>

  <rect x="675" y="125" width="115" height="55" rx="4" fill="#0b111e"/>
  <text x="690" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">1.161 ms</text>
  <text x="685" y="170" font-family="monospace" font-size="9" fill="#64748b">STROBE PULSE</text>

  <rect x="805" y="125" width="120" height="55" rx="4" fill="#0b111e"/>
  <text x="825" y="152" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">1,432</text>
  <text x="815" y="170" font-family="monospace" font-size="9" fill="#64748b">LINES PRINTED</text>

  <rect x="415" y="195" width="510" height="80" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="430" y="220" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">SENSOR INTERLOCK MONITOR</text>
  <text x="430" y="242" font-family="monospace" font-size="10" fill="#4ade80">&bull; Optical Paper Low: FALSE (Normal)</text>
  <text x="430" y="260" font-family="monospace" font-size="10" fill="#4ade80">&bull; Reflective Paper Out: FALSE (Roll Available)</text>
  <text x="680" y="242" font-family="monospace" font-size="10" fill="#4ade80">&bull; Platen Latch: CLOSED</text>
  <text x="680" y="260" font-family="monospace" font-size="10" fill="#4ade80">&bull; Head Over-Temp: 29.1°C (&lt; 70°C)</text>

  <!-- ARINC 429 Bus Words -->
  <rect x="400" y="305" width="540" height="215" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="415" y="330" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">ARINC 429 DIGITAL BUS WORDS (BIT 32 ODD PARITY)</text>
  <text x="415" y="355" font-family="monospace" font-size="11" fill="#4ade80">Label 172 (Char Data)   : 0x86AC547A  [P:1, Chars: 'AC', Seq:1]</text>
  <text x="415" y="380" font-family="monospace" font-size="11" fill="#4ade80">Label 173 (Format Ctrl) : 0x600008BA  [P:0, LineFeed:1, FormFeed:0]</text>
  <text x="415" y="405" font-family="monospace" font-size="11" fill="#4ade80">Label 270 (Printer Stat): 0x60000458  [P:0, Ready:1, Normal:11]</text>
  <text x="415" y="430" font-family="monospace" font-size="11" fill="#4ade80">Label 350 (BITE Fault)  : 0x600000E8  [P:0, No Internal Fault]</text>
  <text x="415" y="455" font-family="monospace" font-size="11" fill="#4ade80">Label 357 (Job Ack Word): 0x800030FB  [P:1, Count:12, Success:1]</text>

  <rect x="415" y="475" width="510" height="32" rx="4" fill="#030712" stroke="#1f2937"/>
  <text x="430" y="495" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">NORMATIVE AIRWORTHINESS AUDIT: 10/10 CRITERIA VERIFIED (100.0%)</text>
</svg>